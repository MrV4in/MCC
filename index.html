<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modernist-Rechner</title>
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="icon" href="icon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Modernist"><meta name="theme-color" content="#2F4A43">
<style>
:root{--bg:#E8ECE9;--surface:#F6F8F5;--ink:#16201E;--muted:#58655F;--line:#C5CEC8;--accent:#2F4A43;--onaccent:#F2F6F3;--warn:#8A4B12;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0F1514;--surface:#172019;--ink:#E4ECE7;--muted:#93A39C;--line:#27332E;--accent:#C6D0B5;--onaccent:#18211A;--warn:#E0A965;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
form{width:100%;max-width:320px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 18px;color:var(--muted);font-size:15px}
input[type=password]{width:100%;font-size:32px;letter-spacing:.5em;text-align:center;padding:10px 0 10px .5em;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
button{margin-top:14px;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--onaccent);font-size:17px;font-weight:600;cursor:pointer}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;font-size:14px;color:var(--muted)}
#err{color:var(--warn);min-height:1.4em;margin:10px 0 0;font-size:14px}
</style></head><body>
<form id="f" autocomplete="off">
<h1>Modernist-Rechner</h1><p>PIN eingeben</p>
<input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autofocus aria-label="PIN">
<button id="go">Öffnen</button>
<label><input type="checkbox" id="keep"> Auf diesem Gerät merken</label>
<div id="err" role="alert"></div>
</form>

async function open_(pin){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  var html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}

  ev.preventDefault();

});
